version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: orvayaya-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: orvayaya
      POSTGRES_PASSWORD: orvayaya_secret
      POSTGRES_DB: orvayaya
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U orvayaya" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
