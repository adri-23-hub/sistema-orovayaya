services:
  app:
    blueprint:nodejs
    buildCommand: npm ci && npm run build
    startCommand: node dist/app.js
    envVars:
      NODE_ENV:
        value: production
      DATABASE_URL:
        externalRef: DATABASE_URL
        sync: false
      JWT_SECRET:
        externalRef: JWT_SECRET
        sync: false
      ADMIN_PASSWORD:
        externalRef: ADMIN_PASSWORD
        sync: false
      CAJERO_PASSWORD:
        externalRef: CAJERO_PASSWORD
        sync: false
    env:
      PORT: "3000"
    healthCheck:
      path: /v1/health
      interval: 10s
    region: "us-east"
    instanceType: starter